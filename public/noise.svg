<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">

  <filter id="noise-filter"
    x="-20%"
    y="-20%"
    width="140%"
    height="140%"
    color-interpolation-filters="sRGB">

    <feTurbulence
      type="turbulence"
      baseFrequency="0.013"
      numOctaves="2"
      seed="0"
      stitchTiles="stitch"
      result="noise"
    />

    <feDiffuseLighting
      in="noise"
      surfaceScale="4.4"
      diffuseConstant="1"
      lighting-color="#ffffff"
      result="lighting"
    >
      <feDistantLight
        azimuth="90"
        elevation="55"
      />
    </feDiffuseLighting>

    <feBlend
      in="SourceGraphic"
      in2="lighting"
      mode="multiply"
    />

  </filter>

  <rect
    width="100%"
    height="100%"
    fill="#e9e4ef"
    filter="url(#noise-filter)"
  />

</svg>